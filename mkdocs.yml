site_name: FlowUI
site_description: A Go UI framework and component library for cross-platform desktop applications, built on Gio.
site_url: https://qianniancn.github.io/flowui/
repo_name: qianniancn/flowui
repo_url: https://github.com/qianniancn/flowui
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: zh
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: 跟随系统主题
  font:
    text: Roboto
    code: Roboto Mono

nav:
  - 首页: index.md
  - 入门:
      - 快速开始: guide/01-快速开始.md
      - 核心概念: guide/02-核心概念.md
      - MVU 与消息: guide/03-MVU与消息.md
  - 界面开发:
      - 布局: guide/04-布局.md
      - 样式与主题: guide/05-样式与主题.md
      - 组件一览: guide/06-组件一览.md
      - 组件截图: guide/16-组件截图.md
      - 表单与受控状态: guide/07-表单与受控状态.md
      - 浮层与弹出: guide/09-浮层与弹出.md
      - 甘特图: guide/15-甘特图.md
  - 应用能力:
      - 命令与订阅: guide/08-命令与订阅.md
      - 自定义组件: guide/10-自定义组件.md
      - 多窗口: guide/11-多窗口.md
      - 动画: guide/12-动画.md
      - 测试: guide/13-测试.md
  - 常见问题: guide/14-常见问题.md
  - 架构说明: architecture.md

plugins:
  - search:
      lang:
        - en
        - zh
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

copyright: Copyright &copy; FlowUI contributors

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/qianniancn/flowui
