site_name: FlowUI
site_description: A Go UI framework and component library for cross-platform desktop applications, built on Gio.
site_url: https://qianniancn.github.io/flowui/en/
repo_name: qianniancn/flowui
repo_url: https://github.com/qianniancn/flowui
edit_uri: edit/main/docs/en/
docs_dir: docs/en
site_dir: site/en
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

nav:
  - Home: index.md
  - Getting started:
      - Getting started: guide/01-quick-start.md
      - Core concepts: guide/02-core-concepts.md
      - MVU and messages: guide/03-mvu-and-messages.md
  - Building interfaces:
      - Layout: guide/04-layout.md
      - Styling and themes: guide/05-styling-and-themes.md
      - Components: guide/06-components.md
      - Component screenshots: guide/16-component-screenshots.md
      - Forms and controlled state: guide/07-forms-and-controlled-state.md
      - Overlays and popups: guide/09-overlays-and-popups.md
      - Gantt chart: guide/15-gantt.md
  - Application capabilities:
      - Commands and subscriptions: guide/08-commands-and-subscriptions.md
      - Custom components: guide/10-custom-components.md
      - Multiple windows: guide/11-multiple-windows.md
      - Animation: guide/12-animation.md
      - Testing: guide/13-testing.md
  - FAQ: guide/14-faq.md

plugins:
  - search:
      lang:
        - en
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

copyright: Copyright &copy; FlowUI contributors

extra:
  alternate:
    - name: 简体中文
      link: https://qianniancn.github.io/flowui/
      lang: zh
    - name: English
      link: https://qianniancn.github.io/flowui/en/
      lang: en
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/qianniancn/flowui
